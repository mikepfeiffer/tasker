name: Tests and security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-app-tests:
    name: Run app tests (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: ubuntu-latest
            platform: Linux
    defaults:
      run:
        working-directory: tasker demo
    steps:
      - name: Check out source into a path containing spaces
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: tasker demo
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install the Windows demo environment
        if: runner.os == 'Windows'
        shell: cmd
        run: call setup.cmd
      - name: Test the Windows launcher from a different directory
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}
        shell: cmd
        run: call "%GITHUB_WORKSPACE%\tasker demo\run.cmd" --help
      - name: Run the app test suite on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: .venv\Scripts\python.exe -m unittest discover -s tests -v
      - name: Install the Linux demo environment
        if: runner.os != 'Windows'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock.txt
          .venv/bin/python -m pip check
      - name: Run the app test suite on Linux
        if: runner.os != 'Windows'
        run: .venv/bin/python -m unittest discover -s tests -v

  codeql:
    name: CodeQL security scan (Python)
    # Start the scan only after both test jobs pass.
    needs: run-app-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # Upload findings to GitHub's code scanning results.
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Initialize CodeQL for Python
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
      - name: Analyze code and upload security findings
        uses: github/codeql-action/analyze@v4

  dependency-review:
    name: Dependency review (third-party packages)
    # Dependency review compares the packages before and after a pull request.
    if: github.event_name == 'pull_request'
    needs: run-app-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check dependency changes for known vulnerabilities
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: low # Fail on any known vulnerability in a dependency change.
          fail-on-scopes: runtime, development, unknown
          license-check: false
          show-openssf-scorecard: false
